# Configuration for IoU-based image filtering

# Maximum IoU threshold - save only images with mIoU <= max_iou
# (saves worst-performing images up to this threshold)
max_iou: 0.9

# Classes to consider when calculating IoU
# If None or empty list, all classes will be used
# Example: [0, 1, 2, 13] - only road, sidewalk, building, car
classes: [8, 11, 3]  # null means all classes

# Maximum number of samples to save (0 = unlimited)
max_samples: 10

# Dataset configuration
dataset: "cityscapes"
workers: 4
gpu_ids: "0"
no_cuda: false

# Data loader configuration
batch_size: 1
base_size: 500
crop_size: 500

# BEV model (SegFormer)
resume: /home/user-3/SensatUrban-BEV-Seg3D/run/cityscapes/Res-Unet/experiment_10/checkpoint.pth.tar
num_labels: 14
ignore_index: 255

# Concerto 3D model
concerto_ckpt: null  # path to Concerto checkpoint (.pth)
concerto_grid_size: 0.05  # voxel size for GridSample transform

# BEV grid / tiling
grid_scale: 0.05  # meters per pixel
grid_size: 25     # tile size in meters
grid_step: 25     # sliding window step in meters

# Output configuration
save_dir: "/home/user-3/filtered_val_samples_BEV_sensatUrban"
save_overlays: true
